<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1565C0"/>

  <!-- edges: input → hidden -->
  <line x1="7" y1="9"  x2="16" y2="13" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>
  <line x1="7" y1="9"  x2="16" y2="22" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>
  <line x1="7" y1="16" x2="16" y2="13" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>
  <line x1="7" y1="16" x2="16" y2="22" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>
  <line x1="7" y1="23" x2="16" y2="13" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>
  <line x1="7" y1="23" x2="16" y2="22" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>

  <!-- edges: hidden → output -->
  <line x1="16" y1="13" x2="25" y2="16" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>
  <line x1="16" y1="22" x2="25" y2="16" stroke="rgba(255,255,255,0.38)" stroke-width="1.2"/>

  <!-- input nodes -->
  <circle cx="7" cy="9"  r="2.5" fill="white"/>
  <circle cx="7" cy="16" r="2.5" fill="white"/>
  <circle cx="7" cy="23" r="2.5" fill="white"/>

  <!-- hidden nodes -->
  <circle cx="16" cy="13" r="2.5" fill="#90CAF9"/>
  <circle cx="16" cy="22" r="2.5" fill="#90CAF9"/>

  <!-- output node -->
  <circle cx="25" cy="16" r="2.8" fill="#FFA726"/>
</svg>
